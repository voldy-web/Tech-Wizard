# Render Blueprint: one click creates the API (Docker) and its PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
databases:
  - name: tech-wizard-db
    databaseName: techwizard
    user: techwizard
    plan: free            # see docs/DEPLOY-RENDER.md about free-plan limits; use a paid plan for real data

services:
  - type: web
    name: tech-wizard-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_HOST
        fromDatabase: { name: tech-wizard-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: tech-wizard-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: tech-wizard-db, property: database }
      - key: DB_USER
        fromDatabase: { name: tech-wizard-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: tech-wizard-db, property: password }
      - key: API_KEY            # secret the mobile app must send in the X-API-Key header
        generateValue: true
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k
