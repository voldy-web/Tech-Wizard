# Render Blueprint for an EXTERNAL PostgreSQL (Neon, Supabase, your own...).
# Use this when your Render account already has its one free database, or you prefer another provider.
# Blueprint Path: render.external-db.yaml
# Render will ask you to type in DB_URL, DB_USER and DB_PASSWORD when you create the Blueprint.
services:
  - type: web
    name: tech-wizard-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_URL              # jdbc:postgresql://HOST/DBNAME?sslmode=require
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: API_KEY             # secret the mobile app must send in the X-API-Key header
        generateValue: true
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k
